<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCMS - Classroom Availability</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Smart Classroom Management - Classroom Availability</h1>
    </header>

    <main>
        <!-- Check Availability Section -->
        <section class="check-availability">
            <h2>Check Classroom Availability</h2>
            <form id="availabilityForm">
                <label for="classroomID">Classroom ID:</label>
                <input type="text" id="classroomID" required>

                <label for="bookingDate">Date:</label>
                <input type="date" id="bookingDate" required>

                <label for="bookingTime">Time:</label>
                <input type="time" id="bookingTime" required>

                <button type="submit">Check Availability</button>
            </form>
            <div id="availabilityResult">
                <!-- Availability result will be shown here -->
            </div>
        </section>

        <!-- Book Classroom Section -->
        <section class="book-classroom">
            <h2>Book a Classroom</h2>
            <form id="bookingForm">
                <label for="bookerName">Name:</label>
                <input type="text" id="bookerName" required>

                <label for="bookerID">ID:</label>
                <input type="text" id="bookerID" required>

                <label for="classroomToBook">Classroom ID:</label>
                <input type="text" id="classroomToBook" required>

                <label for="bookingStart">Start Time:</label>
                <input type="datetime-local" id="bookingStart" required>

                <label for="bookingEnd">End Time:</label>
                <input type="datetime-local" id="bookingEnd" required>

                <button type="submit">Book Classroom</button>
            </form>
        </section>

        <!-- View Bookings Section -->
        <section class="view-bookings">
            <h2>View All Bookings</h2>
            <ul id="bookingList">
                <!-- Bookings will be displayed here -->
            </ul>
        </section>
    </main>

    <script src="classroom-script.js"></script>
</body>
</html>
