<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Management</title>
    <link rel="stylesheet" href="styles.css"> <!-- Path to your CSS file -->
</head>
<body>
    <header>
        <div class="logo">
            <img src="../clogo.png" alt="Logo"> <!-- Replace 'logo.png' with your logo image file -->
            <h1>Faculty Management</h1>
        </div>
        <button id="switchButton">Switch to Admin View</button>
    </header>

    <!-- User View -->
    <main id="userView">
        <section class="search-Faculty">
            <h1>Faculty Management</h1>
            <h2>Find Faculty</h2>
            <input type="text" id="FacultySearchInput" placeholder="Enter Faculty Name">
            <button id="searchButton">Search</button>
            <p id="searchResult"></p>
        </section>

        <section class="availability-chart">
            <h2>Availability Chart</h2>
            <div id="availabilityChart">
                <!-- Availability chart will be populated here -->
            </div>
            <button id="showMoreChartButton" style="display: none;">Show More</button>
            <button id="showLessChartButton" style="display: none;">Show Less</button>
        </section>

        <section class="Faculty-list">
            <h2>Faculty List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Faculty Name</th>
                        <th>Room Number</th>
                    </tr>
                </thead>
                <tbody id="FacultyTableBody">
                    <!-- Faculty list will be populated here -->
                </tbody>
            </table>
            <button id="showMoreListButton" style="display: none;">Show More</button>
            <button id="showLessListButton" style="display: none;">Show Less</button>
        </section>
    </main>

    <!-- Admin View -->
    <main id="adminView" style="display: none;">
        <section class="add-Faculty">
            <h2>Add Faculty</h2>
            <form id="addFacultyForm">
                <input type="text" id="newFacultyName" placeholder="Faculty Name" required>
                <input type="text" id="newRoomNumber" placeholder="Room Number" required>
                <select id="newAvailability" required>
                    <option value="true">Available</option>
                    <option value="false">Not Available</option>
                </select>
                <button type="submit">Add Faculty</button>
            </form>
        </section>

        <section class="Faculty-list">
            <h2>Faculty List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Faculty Name</th>
                        <th>Room Number</th>
                        <th>Availability</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminFacultyTableBody">
                    <!-- Admin Faculty list will be populated here -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getDatabase, ref, set, get, remove } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-analytics.js";
    
        const firebaseConfig = {
            apiKey: "AIzaSyBQ_ZksLUIiSvlLh-ebM5mlEmOTD6QAPxg",
            authDomain: "techhunter-9b7c5.firebaseapp.com",
            databaseURL: "https://techhunter-9b7c5-default-rtdb.firebaseio.com",
            projectId: "techhunter-9b7c5",
            storageBucket: "techhunter-9b7c5.appspot.com",
            messagingSenderId: "969801209943",
            appId: "1:969801209943:web:3bdf834868d13b7c02ab12",
            measurementId: "G-4XKR35QGKW"
        };
    
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        const analytics = getAnalytics(app);
    
        let Facultys = [];
        let isAdminView = false;
        const initialShownItems = 5;
        let shownItemsCount = initialShownItems;
    
        function fetchFacultys() {
            const dbRef = ref(database, 'Facultys');
            get(dbRef).then((snapshot) => {
                if (snapshot.exists()) {
                    Facultys = Object.entries(snapshot.val()).map(([room, data]) => ({
                        name: data.name,
                        room: room,
                        available: data.available
                    }));
                } 
                renderFacultyListUser(Facultys);
                renderAvailabilityChart(Facultys);
                renderFacultyListAdmin();
            }).catch((error) => {
                console.error("Error fetching data: ", error);
            });
        }
    
        function saveFacultys() {
            const dbRef = ref(database, 'Facultys');
            const updates = {};
    
            Facultys.forEach(Faculty => {
                updates[Faculty.room] = {
                    name: Faculty.name,
                    available: Faculty.available
                };
            });
    
            set(dbRef, updates).then(() => {
                console.log('Data saved successfully');
            }).catch((error) => {
                console.error('Error saving data:', error);
            });
        }
    
        function renderFacultyListUser(FacultysToDisplay) {
            const FacultyTableBody = document.getElementById('FacultyTableBody');
            const showMoreListButton = document.getElementById('showMoreListButton');
            const showLessListButton = document.getElementById('showLessListButton');
            FacultyTableBody.innerHTML = '';
    
            let displayedFacultys = FacultysToDisplay.slice(0, shownItemsCount);
    
            displayedFacultys.forEach(Faculty => {
                const row = document.createElement('tr');
                row.innerHTML = 
                    `<td>${Faculty.name}</td>
                     <td>${Faculty.room}</td>`;
                FacultyTableBody.appendChild(row);
            });
    
            showMoreListButton.style.display = FacultysToDisplay.length > shownItemsCount ? 'block' : 'none';
            showLessListButton.style.display = shownItemsCount > initialShownItems ? 'block' : 'none';
        }
    
        function renderAvailabilityChart(FacultysToDisplay) {
            const availabilityChart = document.getElementById('availabilityChart');
            const showMoreChartButton = document.getElementById('showMoreChartButton');
            const showLessChartButton = document.getElementById('showLessChartButton');
            availabilityChart.innerHTML = '';
    
            let displayedFacultys = FacultysToDisplay.slice(0, shownItemsCount);
    
            displayedFacultys.forEach(Faculty => {
                const bar = document.createElement('div');
                bar.className = 'chart-bar';
                bar.innerHTML = 
                    `<div class="bar-label">${Faculty.name}</div>
                     <div class="status-label ${Faculty.available ? 'available-label' : 'not-available-label'}">
                        ${Faculty.available ? 'Available' : 'Not Available'}
                     </div>`;
                availabilityChart.appendChild(bar);
            });
    
            showMoreChartButton.style.display = FacultysToDisplay.length > shownItemsCount ? 'block' : 'none';
            showLessChartButton.style.display = shownItemsCount > initialShownItems ? 'block' : 'none';
        }
    
        function renderFacultyListAdmin() {
            const adminFacultyTableBody = document.getElementById('adminFacultyTableBody');
            adminFacultyTableBody.innerHTML = '';
    
            Facultys.forEach((Faculty, index) => {
                const row = document.createElement('tr');
                row.dataset.index = index; // Store the index in a data attribute
                row.innerHTML = 
                    `<td contenteditable="false" class="editable">${Faculty.name}</td>
                     <td contenteditable="false" class="editable">${Faculty.room}</td>
                     <td>
                        <select class="availability-select" ${Faculty.available ? '' : 'disabled'}>
                            <option value="true" ${Faculty.available ? 'selected' : ''}>Available</option>
                            <option value="false" ${!Faculty.available ? 'selected' : ''}>Not Available</option>
                        </select>
                     </td>
                     <td>
                        <button class="edit-button" onclick="window.enableEdit(this)">Edit</button>
                        <button class="save-button" onclick="window.saveFaculty(this)" style="display: none;">Save</button>
                        <button class="delete-button" onclick="window.deleteFaculty(this)">Delete</button>
                     </td>`;
                adminFacultyTableBody.appendChild(row);
            });
        }
    
        function enableEdit(button) {
            const row = button.closest('tr');
            row.querySelectorAll('.editable').forEach(cell => {
                cell.contentEditable = true;
                cell.style.backgroundColor = '#f9f9f9';
            });
            row.querySelector('.availability-select').disabled = false;
            button.style.display = 'none';
            row.querySelector('.save-button').style.display = 'inline-block';
        }
    
        function saveFaculty(button) {
            const row = button.closest('tr');
            const index = row.dataset.index;
    
            Facultys[index].name = row.children[0].innerText;
            Facultys[index].room = row.children[1].innerText;
            Facultys[index].available = row.querySelector('.availability-select').value === 'true';
    
            saveFacultys();
            row.querySelectorAll('.editable').forEach(cell => {
                cell.contentEditable = false;
                cell.style.backgroundColor = '#ffffff';
            });
            row.querySelector('.availability-select').disabled = true;
            button.style.display = 'none';
            row.querySelector('.edit-button').style.display = 'inline-block';
            renderFacultyListUser(Facultys);
            renderAvailabilityChart(Facultys);
        }
    
        function deleteFaculty(button) {
            const row = button.closest('tr');
            const index = row.dataset.index;
    
            Facultys.splice(index, 1); // Remove from local array first
            saveFacultys(); // Update Firebase database
    
            const dbRef = ref(database, `Facultys/${Facultys[index].room}`);
            remove(dbRef).then(() => {
                console.log('Data deleted successfully');
            }).catch((error) => {
                console.error('Error deleting data:', error);
            });
    
            row.remove();
            renderFacultyListUser(Facultys);
            renderAvailabilityChart(Facultys);
        }
    
        window.enableEdit = enableEdit;
        window.saveFaculty = saveFaculty;
        window.deleteFaculty = deleteFaculty;
    
        document.getElementById('searchButton').addEventListener('click', () => {
            const searchTerm = document.getElementById('FacultySearchInput').value.toLowerCase();
            const filteredFacultys = Facultys.filter(Faculty => 
                Faculty.name.toLowerCase().includes(searchTerm)
            );
            renderFacultyListUser(filteredFacultys);
        });
    
        document.getElementById('showMoreListButton').addEventListener('click', () => {
            shownItemsCount += 5;
            renderFacultyListUser(Facultys);
            renderAvailabilityChart(Facultys);
        });
    
        document.getElementById('showLessListButton').addEventListener('click', () => {
            shownItemsCount = Math.max(initialShownItems, shownItemsCount - 5);
            renderFacultyListUser(Facultys);
            renderAvailabilityChart(Facultys);
        });
    
        document.getElementById('showMoreChartButton').addEventListener('click', () => {
            shownItemsCount += 5;
            renderAvailabilityChart(Facultys);
            renderFacultyListUser(Facultys);
        });
    
        document.getElementById('showLessChartButton').addEventListener('click', () => {
            shownItemsCount = Math.max(initialShownItems, shownItemsCount - 5);
            renderAvailabilityChart(Facultys);
            renderFacultyListUser(Facultys);
        });
    
        document.getElementById('addFacultyForm').addEventListener('submit', (event) => {
            event.preventDefault();
    
            const newFacultyName = document.getElementById('newFacultyName').value;
            const newRoomNumber = document.getElementById('newRoomNumber').value;
            const newAvailability = document.getElementById('newAvailability').value === 'true';
    
            Facultys.push({
                name: newFacultyName,
                room: newRoomNumber,
                available: newAvailability
            });
    
            saveFacultys();
            document.getElementById('addFacultyForm').reset();
            renderFacultyListAdmin();
            renderFacultyListUser(Facultys);
            renderAvailabilityChart(Facultys);
        });
    
        document.getElementById('switchButton').addEventListener('click', () => {
            isAdminView = !isAdminView;
            document.getElementById('userView').style.display = isAdminView ? 'none' : 'block';
            document.getElementById('adminView').style.display = isAdminView ? 'block' : 'none';
            document.getElementById('switchButton').textContent = isAdminView ? 'Switch to User View' : 'Switch to Admin View';
        });
    
        fetchFacultys();
    </script>
</body>
</html>
