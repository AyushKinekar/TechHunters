<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Management</title>
    <link rel="stylesheet" href="styles.css">
    <style>
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="../clogo.png" alt="Logo"> <!-- Replace 'logo.png' with your logo image file -->
            <h1>TechHunters</h1>
        </div>
        <div class="nav-buttons">
            <a href="#"><button>Button1</button></a>
            <a href="#"><button>Button2</button></a>
            <a href="#"><button>Button3</button></a>
        </div>
    </header>

    <button id="switchButton">Switch to Admin View</button>
    
    <!-- User View -->
    <main id="userView">
        <section class="search-faculty">
            <h1>Faculty Management</h1>
            <h2>Find Faculty</h2>
            <input type="text" id="facultySearchInput" placeholder="Enter Faculty Name">
            <button id="searchButton">Search</button>
            <p id="searchResult"></p>
        </section>

        <section class="availability-chart">
            <h2>Availability Chart</h2>
            <div id="availabilityChart">
                <!-- Availability chart will be populated here -->
            </div>
            <button id="showMoreChartButton" style="display: none;">Show More</button>
            <button id="showLessChartButton" style="display: none;">Show Less</button>
        </section>

        <section class="faculty-room-list">
            <h2>Faculty Room List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Faculty Name</th>
                        <th>Room Number</th>
                    </tr>
                </thead>
                <tbody id="facultyTableBody">
                    <!-- Faculty list will be populated here -->
                </tbody>
            </table>
            <button id="showMoreListButton" style="display: none;">Show More</button>
            <button id="showLessListButton" style="display: none;">Show Less</button>
        </section>
    </main>

    <!-- Admin View -->
    <main id="adminView" style="display: none;">
        <section class="add-faculty">
            <h2>Add Faculty</h2>
            <form id="addFacultyForm">
                <input type="text" id="newFacultyName" placeholder="Faculty Name" required>
                <input type="text" id="newRoomNumber" placeholder="Room Number" required>
                <select id="newAvailability" required>
                    <option value="true">Available</option>
                    <option value="false">Not Available</option>
                </select>
                <button type="submit">Add Faculty</button>
            </form>
        </section>

        <section class="faculty-room-list">
            <h2>Faculty Room List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Faculty Name</th>
                        <th>Room Number</th>
                        <th>Availability</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="adminFacultyTableBody">
                    <!-- Admin faculty list will be populated here -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
